<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task & User Management System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-4 text-center">Management Dashboard</h1>

      <!-- Navigation Tabs (Navigation between Users & Tasks UI) -->
      <ul class="nav nav-pills mb-4" id="mainTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-item nav-link active fs-5"
            id="users-tab"
            data-bs-toggle="pill"
            data-bs-target="#users-panel"
            type="button"
            role="tab"
          >
            👥 Users Management
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-item nav-link fs-5"
            id="tasks-tab"
            data-bs-toggle="pill"
            data-bs-target="#tasks-panel"
            type="button"
            role="tab"
          >
            📋 Tasks Management
          </button>
        </li>
      </ul>

      <!-- Tabs Content -->
      <div class="tab-content" id="mainTabsContent">
        <!-- ================= USERS SECTION ================= -->
        <div class="tab-pane fade show active" id="users-panel" role="tabpanel">
          <div class="card shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3>Users List</h3>
              <button id="openAddUserBtn" class="btn btn-primary">
                + Add User
              </button>
            </div>

            <!-- Users Table -->
            <div class="table-responsive">
              <table class="table table-bordered align-middle" id="usersTable">
                <thead class="table-dark">
                  <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </div>

          <div class="modal-overlay" id="editUserModal" style="display: none">
            <div class="modal-box">
              <div class="modal-header">
                <h2>Edit User</h2>
                <button type="button" id="closeEditUserBtn" class="close-btn">
                  &times;
                </button>
              </div>

              <form id="editUserForm">
                <input type="hidden" id="editUserId" />
                <!-- لتخزين معرف المستخدم المراد تعديله -->

                <div class="form-group mb-3">
                  <label for="editUserName" class="form-label">Name</label>
                  <input
                    type="text"
                    id="editUserName"
                    class="form-control"
                    required
                  />
                </div>

                <div class="form-group mb-3">
                  <label for="editUserEmail" class="form-label">Email</label>
                  <input
                    type="email"
                    id="editUserEmail"
                    class="form-control"
                    required
                  />
                </div>

                <div class="modal-footer">
                  <button
                    type="button"
                    id="cancelEditUserBtn"
                    class="cancel-btn"
                  >
                    Cancel
                  </button>
                  <button type="submit" class="submit-btn btn btn-warning">
                    Save Changes
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- ================= TASKS SECTION ================= -->
        <div class="tab-pane fade" id="tasks-panel" role="tabpanel">
          <div class="card shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3>Tasks List</h3>

              <div class="d-flex gap-2">
                <select id="statusFilter" class="form-select w-auto">
                  <option value="All">All Statuses</option>
                  <option value="Pending">Pending</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
                <button id="openAddTaskBtn" class="btn btn-primary">
                  + Add Task
                </button>
                <button id="openAssignTaskToUsersBtn" class="btn btn-outline-primary">
                  👥 Assign Task to Multiple Users
                </button>
                <button id="openAssignUserTasksBtn" class="btn btn-outline-success">
                  📋 Assign Multiple Tasks to User
                </button>
              </div>
            </div>

            <!-- Tasks Table -->
            <div class="table-responsive">
              <table class="table table-bordered align-middle" id="tasksTable">
                <thead class="table-dark">
                  <tr>
                    <th>#</th>
                    <th>Task Name</th>
                    <th>Assigned User</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody id="tasksTableBody"></tbody>
              </table>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- ================= ADD USER MODAL ================= -->
    <div class="modal-overlay" id="addUserModal" style="display: none">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Add New User</h2>
          <button type="button" id="closeAddUserBtn" class="close-btn">
            &times;
          </button>
        </div>

        <form id="addUserForm">
          <div class="form-group mb-3">
            <label for="userName" class="form-label">Name</label>
            <input
              type="text"
              id="userName"
              class="form-control"
              placeholder="Enter name"
              required
            />
          </div>

          <div class="form-group mb-3">
            <label for="userEmail" class="form-label">Email</label>
            <input
              type="email"
              id="userEmail"
              class="form-control"
              placeholder="Enter email"
              required
            />
          </div>

          <div class="modal-footer">
            <button type="button" id="cancelAddUserBtn" class="cancel-btn">
              Cancel
            </button>
            <button type="submit" class="submit-btn btn btn-primary">
              Add User
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ================= ADD TASK MODAL ================= -->
    <div class="modal-overlay" id="addTaskModal" style="display: none">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Add New Task</h2>
          <button type="button" id="closeAddTaskBtn" class="close-btn">
            &times;
          </button>
        </div>

        <form id="addTaskForm">
          <div class="form-group mb-3">
            <label for="taskName" class="form-label">Task Name</label>
            <input
              type="text"
              id="taskName"
              class="form-control"
              placeholder="Enter Task Name"
              required
            />
          </div>

          <div class="form-group mb-3">
            <label for="taskStatus" class="form-label">Status</label>
            <select id="taskStatus" class="form-select" required>
              <option value="">Select a Status</option>
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <div class="form-group mb-3">
            <label for="user" class="form-label">User</label>
            <select id="user" class="form-select" required>
              <option value="">Select a user</option>
            </select>
          </div>

          <div class="modal-footer">
            <button type="button" id="cancelAddTaskBtn" class="cancel-btn">
              Cancel
            </button>
            <button type="submit" class="submit-btn btn btn-primary">
              Add Task
            </button>
          </div>
        </form>
      </div>
    </div>


    <!-- ================= EDIT STATUS MODAL ================= -->
<div class="modal-overlay" id="editStatusModal" style="display: none">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Change Task Status</h2>
      <button type="button" id="closeEditStatusBtn" class="close-btn">&times;</button>
    </div>
    <form id="editStatusForm">
      <input type="hidden" id="editTaskId" />
      <div class="form-group mb-3">
        <label for="editStatusSelect" class="form-label">Select Status</label>
        <select id="editStatusSelect" class="form-select" required>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelEditStatusBtn" class="cancel-btn">Cancel</button>
        <button type="submit" class="submit-btn btn btn-warning">Update Status</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal 1: تعيين مهمة لعدة مستخدمين -->
<div class="modal-overlay" id="assignTaskToUsersModal" style="display: none">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Assign Task to Multiple Users</h2>
      <button type="button" class="close-btn close-multi-modal">&times;</button>
    </div>
    <form id="assignTaskToUsersForm">
      <div class="form-group mb-3">
        <label for="multiTaskName" class="form-label">Task Name</label>
        <input type="text" id="multiTaskName" class="form-control" required placeholder="Enter task name" />
      </div>
      <div class="form-group mb-3">
        <label for="multiTaskStatus" class="form-label">Status</label>
        <select id="multiTaskStatus" class="form-select" required>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="form-group mb-3">
        <label for="multiUsersSelect" class="form-label">Select Users (Hold Ctrl/Cmd to select multiple)</label>
        <select id="multiUsersSelect" class="form-select" multiple required size="5"></select>
      </div>
      <div class="modal-footer">
        <button type="button" class="cancel-btn close-multi-modal">Cancel</button>
        <button type="submit" class="submit-btn btn btn-primary">Create Tasks</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal 2: تعيين عدة مهام لمستخدم واحد -->
<div class="modal-overlay" id="assignUserTasksModal" style="display: none">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Assign Multiple Tasks to a User</h2>
      <button type="button" class="close-btn close-multi-modal">&times;</button>
    </div>
    <form id="assignUserTasksForm">
      <div class="form-group mb-3">
        <label for="singleUserSelect" class="form-label">Select User</label>
        <select id="singleUserSelect" class="form-select" required></select>
      </div>
      <div class="form-group mb-3">
        <label for="multipleTaskNames" class="form-label">Task Names (One per line or comma-separated)</label>
        <textarea id="multipleTaskNames" class="form-control" rows="4" required placeholder="Task 1&#10;Task 2&#10;Task 3"></textarea>
      </div>
      <div class="form-group mb-3">
        <label for="bulkTasksStatus" class="form-label">Default Status</label>
        <select id="bulkTasksStatus" class="form-select" required>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="cancel-btn close-multi-modal">Cancel</button>
        <button type="submit" class="submit-btn btn btn-success">Create All Tasks</button>
      </div>
    </form>
  </div>
</div>


    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application Scripts -->
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/task.js"></script>
  </body>
</html>
