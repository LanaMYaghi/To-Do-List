<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task & User Management System</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-4 text-center">Management Dashboard</h1>

      <!-- Navigation Tabs (Navigation between Users & Tasks UI) -->
      <ul class="nav nav-pills mb-4" id="mainTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-item nav-link active fs-5"
            id="users-tab"
            data-bs-toggle="pill"
            data-bs-target="#users-panel"
            type="button"
            role="tab"
          >
            👥 Users Management
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-item nav-link fs-5"
            id="tasks-tab"
            data-bs-toggle="pill"
            data-bs-target="#tasks-panel"
            type="button"
            role="tab"
          >
            📋 Tasks Management
          </button>
        </li>
      </ul>

      <!-- Tabs Content -->
      <div class="tab-content" id="mainTabsContent">
        <!-- ================= USERS SECTION ================= -->
        <div class="tab-pane fade show active" id="users-panel" role="tabpanel">
          <div class="card shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3>Users List</h3>
              <button id="openAddUserBtn" class="btn btn-primary">
                + Add User
              </button>
            </div>

            <!-- Users Table -->
            <div class="table-responsive">
              <table class="table table-bordered align-middle" id="usersTable">
                <thead class="table-dark">
                  <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </div>

          <div class="modal-overlay" id="editUserModal" style="display: none">
            <div class="modal-box">
              <div class="modal-header">
                <h2>Edit User</h2>
                <button type="button" id="closeEditUserBtn" class="close-btn">
                  &times;
                </button>
              </div>

              <form id="editUserForm">
                <input type="hidden" id="editUserId" />
                <!-- لتخزين معرف المستخدم المراد تعديله -->

                <div class="form-group mb-3">
                  <label for="editUserName" class="form-label">Name</label>
                  <input
                    type="text"
                    id="editUserName"
                    class="form-control"
                    required
                  />
                </div>

                <div class="form-group mb-3">
                  <label for="editUserEmail" class="form-label">Email</label>
                  <input
                    type="email"
                    id="editUserEmail"
                    class="form-control"
                    required
                  />
                </div>

                <div class="modal-footer">
                  <button
                    type="button"
                    id="cancelEditUserBtn"
                    class="cancel-btn"
                  >
                    Cancel
                  </button>
                  <button type="submit" class="submit-btn btn btn-warning">
                    Save Changes
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- ================= TASKS SECTION ================= -->
        <div class="tab-pane fade" id="tasks-panel" role="tabpanel">
          <div class="card shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3>Tasks List</h3>

              <div class="d-flex gap-2">
                <select id="statusFilter" class="form-select w-auto">
                  <option value="All">All Statuses</option>
                  <option value="Pending">Pending</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
                <button id="openAddTaskBtn" class="btn btn-primary">
                  + Add Task
                </button>
              </div>
            </div>

            <!-- Tasks Table -->
            <div class="table-responsive">
              <table class="table table-bordered align-middle" id="tasksTable">
                <thead class="table-dark">
                  <tr>
                    <th>#</th>
                    <th>Task Name</th>
                    <th>Assigned User</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="tasksTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= ADD USER MODAL ================= -->
    <div class="modal-overlay" id="addUserModal" style="display: none">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Add New User</h2>
          <button type="button" id="closeAddUserBtn" class="close-btn">
            &times;
          </button>
        </div>

        <form id="addUserForm">
          <div class="form-group mb-3">
            <label for="userName" class="form-label">Name</label>
            <input
              type="text"
              id="userName"
              class="form-control"
              placeholder="Enter name"
              required
            />
          </div>

          <div class="form-group mb-3">
            <label for="userEmail" class="form-label">Email</label>
            <input
              type="email"
              id="userEmail"
              class="form-control"
              placeholder="Enter email"
              required
            />
          </div>

          <div class="modal-footer">
            <button type="button" id="cancelAddUserBtn" class="cancel-btn">
              Cancel
            </button>
            <button type="submit" class="submit-btn btn btn-primary">
              Add User
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ================= ADD TASK MODAL ================= -->
    <div class="modal-overlay" id="addTaskModal" style="display: none">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Add New Task</h2>
          <button type="button" id="closeAddTaskBtn" class="close-btn">
            &times;
          </button>
        </div>

        <form id="addTaskForm">
          <div class="form-group mb-3">
            <label for="taskName" class="form-label">Task Name</label>
            <input
              type="text"
              id="taskName"
              class="form-control"
              placeholder="Enter Task Name"
              required
            />
          </div>

          <div class="form-group mb-3">
            <label for="taskStatus" class="form-label">Status</label>
            <select id="taskStatus" class="form-select" required>
              <option value="">Select a Status</option>
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <div class="form-group mb-3">
            <label for="user" class="form-label">User</label>
            <select id="user" class="form-select" required>
              <option value="">Select a user</option>
            </select>
          </div>

          <div class="modal-footer">
            <button type="button" id="cancelAddTaskBtn" class="cancel-btn">
              Cancel
            </button>
            <button type="submit" class="submit-btn btn btn-primary">
              Add Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application Scripts -->
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/task.js"></script>
  </body>
</html>
